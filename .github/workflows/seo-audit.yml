name: SEO Audit & Quality Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-audit:
    name: Build & SEO Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit
      
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      
      - name: Check bundle size
        working-directory: frontend
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### File sizes:" >> $GITHUB_STEP_SUMMARY
          find dist/assets -type f -name '*.js' -o -name '*.css' | xargs ls -lh | awk '{print $5, $NF}' >> $GITHUB_STEP_SUMMARY
      
      - name: Validate HTML
        working-directory: frontend
        run: |
          # Check index.html has required SEO elements
          echo "Checking SEO elements in index.html..."
          grep -q 'lang="vi"' index.html && echo "✅ lang=vi" || echo "❌ Missing lang=vi"
          grep -q 'meta name="description"' index.html && echo "✅ meta description" || echo "❌ Missing meta description"
          grep -q 'og:title' index.html && echo "✅ og:title" || echo "❌ Missing og:title"
          grep -q 'og:description' index.html && echo "✅ og:description" || echo "❌ Missing og:description"
          grep -q 'twitter:card' index.html && echo "✅ twitter:card" || echo "❌ Missing twitter:card"
          grep -q 'canonical' index.html && echo "✅ canonical" || echo "❌ Missing canonical"
          grep -q 'application/ld+json' index.html && echo "✅ JSON-LD" || echo "❌ Missing JSON-LD"
      
      - name: Validate robots.txt
        working-directory: frontend/public
        run: |
          echo "Checking robots.txt..."
          test -f robots.txt && echo "✅ robots.txt exists" || (echo "❌ Missing robots.txt" && exit 1)
          grep -q 'Sitemap:' robots.txt && echo "✅ Sitemap directive" || echo "⚠️ Missing Sitemap directive"
      
      - name: Validate sitemap.xml
        working-directory: frontend/public
        run: |
          echo "Checking sitemap.xml..."
          test -f sitemap.xml && echo "✅ sitemap.xml exists" || (echo "❌ Missing sitemap.xml" && exit 1)
          xmllint --noout sitemap.xml 2>/dev/null && echo "✅ Valid XML" || echo "⚠️ xmllint not available, skipping XML validation"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build-and-audit
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.js'
          uploadArtifacts: true
          temporaryPublicStorage: true

  broken-links:
    name: Check Broken Links
    runs-on: ubuntu-latest
    needs: build-and-audit
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      
      - name: Serve & Check Links
        working-directory: frontend
        run: |
          npx serve dist -l 5173 &
          sleep 3
          npx linkinator http://localhost:5173 --recurse --skip "^(?!http://localhost)" --format json > linkinator-report.json || true
          cat linkinator-report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          broken = [l for l in data.get('links', []) if l.get('status', 0) >= 400]
          print(f'Total links: {len(data.get(\"links\", []))}')
          print(f'Broken links: {len(broken)}')
          for l in broken:
              print(f'  ❌ {l[\"url\"]} ({l[\"status\"]})')
          if broken:
              sys.exit(1)
          "
