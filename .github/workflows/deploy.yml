# ============================================================================
# AI Marketing Hub — Auto Deploy to VPS
# Trigger: push to main → SSH → pull + docker-compose rebuild
# ============================================================================

name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 300s
          command_timeout: 600s
          script: |
            cd /opt/ai-marketing-hub
            echo "=== $(date) — Starting auto-deploy ==="
            
            # Pull latest code
            git fetch origin main
            git reset --hard origin/main
            
            # Restore .env
            if [ ! -f backend/.env ] && [ -f /tmp/amh_env_backup ]; then
              cp /tmp/amh_env_backup backend/.env
            fi
            
            # Rebuild containers
            docker-compose down
            docker-compose up --build -d
            
            echo "=== $(date) — Deploy complete ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}'
