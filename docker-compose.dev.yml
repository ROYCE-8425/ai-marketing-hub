# ============================================================================
# AI Marketing Hub — Docker Compose (Development)
# Overrides production compose with hot-reload for both services.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================================

version: '3.8'

services:
  # ── Backend (hot-reload with volume mount) ────────────────────────────────
  backend:
    build: ./backend
    container_name: amh-backend-dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - backend-dev-data:/app/data
      # Prevent overwriting installed packages
      - /app/__pycache__
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
    networks:
      - amh-network

  # ── Database (PostgreSQL) ────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: amh-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: amh_user
      POSTGRES_PASSWORD: amh_password
      POSTGRES_DB: aimarketinghub
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - amh-network
  # ── Frontend (Vite dev server with HMR) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: amh-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - amh-network

volumes:
  backend-dev-data:
    driver: local
  postgres-dev-data:
    driver: local

networks:
  amh-network:
    driver: bridge
