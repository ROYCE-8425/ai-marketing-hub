# ============================================================================
# AI Marketing Hub — Docker Compose (Production)
# ============================================================================

version: '3.3'

services:
  # ── Backend (FastAPI + Uvicorn) ───────────────────────────────────────────
  backend:
    build: ./backend
    container_name: amh-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
      - ./backend/.env:/app/.env:rw
      - backend-db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - amh-network

  # ── Database (PostgreSQL) ────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: amh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: amh_user
      POSTGRES_PASSWORD: amh_password
      POSTGRES_DB: aimarketinghub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - amh-network
  # ── Frontend (React + Nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: amh-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - amh-network

volumes:
  backend-data:
    driver: local
  backend-db:
    driver: local
  postgres-data:
    driver: local

networks:
  amh-network:
    driver: bridge
