# ============================================================================
# AI Marketing Hub — Docker Compose (Production)
# ============================================================================

version: '3.3'

services:
  # ── Backend (FastAPI + Uvicorn) ───────────────────────────────────────────
  backend:
    build: ./backend
    container_name: amh-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - amh-network

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: amh-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - amh-network

volumes:
  backend-data:
    driver: local

networks:
  amh-network:
    driver: bridge
